# Build CAMFR and run the testsuite, plus an AddressSanitizer/UBSan run.
# The commands mirror the local workflow in CLAUDE.md (uv sync, pytest,
# make asan).

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)build and publish to PyPI, e.g. v3.0.0-alpha.3"
        required: false
        default: ""

jobs:
  test:
    name: Test (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python }}   # overrides .python-version for every uv call
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # setuptools-scm needs the tags for the version

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gfortran libblitz0-dev libblas-dev liblapack-dev

      - uses: astral-sh/setup-uv@v10.2.0   # no floating v10 tag upstream
        with:
          enable-cache: true

      - name: Build and install
        run: uv sync --locked

      - name: Test
        run: uv run --no-sync pytest

  sanitizers:
    name: ASan + UBSan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gfortran libblitz0-dev libblas-dev liblapack-dev

      - uses: astral-sh/setup-uv@v10.2.0   # no floating v10 tag upstream
        with:
          enable-cache: true

      - name: Build with sanitizers
        run: |
          uv sync --locked
          make asan

      # The extension is loaded into an uninstrumented Python, so the ASan
      # runtime is preloaded. Leak checking is off (Python itself "leaks" at
      # exit); UBSan findings abort, so any report fails the job.
      - name: Test under ASan + UBSan
        run: |
          export LD_PRELOAD=$(gcc -print-file-name=libasan.so)
          export ASAN_OPTIONS=detect_leaks=0
          export UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1:suppressions=$PWD/ubsan.supp
          .venv/bin/python -m pytest

  # Linux wheels (manylinux_2_28, x86_64) with cibuildwheel, one job per
  # CPython version; configuration in [tool.cibuildwheel] in pyproject.toml.
  # Each wheel is tested in a clean environment and kept as a workflow
  # artifact; nothing is published.
  wheels:
    name: Wheel (${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: [cp310, cp311, cp312, cp313, cp314]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # setuptools-scm needs the tags for the version

      - uses: pypa/cibuildwheel@v4.2.1
        with:
          only: ${{ matrix.python }}-manylinux_x86_64

      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.python }}-manylinux_x86_64
          path: wheelhouse/*.whl
          if-no-files-found: error

  sdist:
    name: Source distribution
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v10.2.0   # no floating v10 tag upstream

      - name: Build the sdist
        run: uv build --sdist

      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  # The documentation site (docs/, Sphinx), with warnings as errors. autodoc
  # imports camfr, so the extension is built first. The site goes out as a
  # Pages artifact, deployed by the next job on pushes to main.
  docs:
    name: Documentation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gfortran libblitz0-dev libblas-dev liblapack-dev

      - uses: astral-sh/setup-uv@v10.2.0   # no floating v10 tag upstream
        with:
          enable-cache: true

      - name: Build and install
        run: uv sync --locked --group docs

      - name: Build the site
        run: uv run --no-sync sphinx-build -W --keep-going -b html docs docs/_build/html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_build/html

  # Publish the site on GitHub Pages (https://abdelix.com/camfr3/) from
  # main, once the tests pass too.
  pages:
    name: Deploy documentation
    needs: [docs, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    concurrency: pages
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # On pushes to main, after the tests pass: compute the next version from the
  # Conventional Commits, update CHANGELOG.md, tag and create a GitHub release
  # (python-semantic-release, configured in pyproject.toml). Nothing is
  # published to PyPI yet.
  release:
    name: Release
    needs: [test, sanitizers, wheels, sdist]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    concurrency: release
    permissions:
      contents: write
    outputs:
      released: ${{ steps.release.outputs.released }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      # Release exactly the commit that was tested, even if main moved on.
      - name: Reset the branch to the tested commit
        run: git reset --hard ${{ github.sha }}

      - name: Semantic release
        id: release
        uses: python-semantic-release/python-semantic-release@v10.7.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          build: false

  # When a release was made: rebuild the wheels and the sdist at the new tag
  # (the ones above carry a .devN+g<hash> version, which PyPI rejects) and
  # upload them to PyPI with trusted publishing (no token; configured on PyPI
  # for this repository, workflow ci.yml, environment pypi). A manual run with
  # the input 'tag' publishes an existing release instead:
  #   gh workflow run ci.yml --ref main -f tag=v3.0.0-alpha.3
  release-wheels:
    name: Release wheel (${{ matrix.python }})
    needs: release
    # release is skipped on manual runs; !cancelled() lets these jobs run then.
    if: >-
      !cancelled() && (needs.release.outputs.released == 'true'
      || (github.event_name == 'workflow_dispatch' && inputs.tag != ''))
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: [cp310, cp311, cp312, cp313, cp314]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || needs.release.outputs.tag }}

      - uses: pypa/cibuildwheel@v4.2.1
        with:
          only: ${{ matrix.python }}-manylinux_x86_64

      - uses: actions/upload-artifact@v7
        with:
          name: release-wheel-${{ matrix.python }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  release-sdist:
    name: Release sdist
    needs: release
    # release is skipped on manual runs; !cancelled() lets these jobs run then.
    if: >-
      !cancelled() && (needs.release.outputs.released == 'true'
      || (github.event_name == 'workflow_dispatch' && inputs.tag != ''))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || needs.release.outputs.tag }}

      - uses: astral-sh/setup-uv@v10.2.0   # no floating v10 tag upstream

      - name: Build the sdist
        run: uv build --sdist

      - uses: actions/upload-artifact@v7
        with:
          name: release-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: [release-wheels, release-sdist]
    if: ${{ !cancelled() && needs.release-wheels.result == 'success' && needs.release-sdist.result == 'success' }}
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/camfr3/
    permissions:
      id-token: write          # trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: List the distributions
        run: ls -l dist

      - uses: pypa/gh-action-pypi-publish@release/v1
