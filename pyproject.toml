[build-system]
# The extension is built with CMake (CMakeLists.txt) through scikit-build-core,
# with pybind11 bindings (no NumPy headers needed). CMake and Ninja come from
# PyPI when they are not installed.
#
# pybind11 < 3.1: 3.1.0 runs call-policy post-call hooks even when an overload
# is rejected, so keep_alive<0, N> on an overloaded function (CAMFR's '+'
# operators) dereferences the "try next overload" marker and crashes
# (PORTING_JOURNAL.md entry 39; testsuite/lifetime.py catches it).
requires = ["scikit-build-core>=0.11", "setuptools-scm>=8", "pybind11>=2.12,<3.1"]
build-backend = "scikit_build_core.build"

# Published as 'camfr3' because the PyPI name 'camfr' belongs to the original
# author. The import name is still 'camfr'.

[project]
name = "camfr3"
dynamic = ["version"]
description = "CAvity Modelling FRamework, ported to Python 3"
readme = "README.md"
license = "GPL-2.0-only"
license-files = ["LICENSE", "COPYRIGHT", "AUTHORS", "NOTICE"]
authors = [{ name = "Peter Bienstman", email = "Peter.Bienstman@UGent.be" }]
maintainers = [{ name = "Abdelfettah Hadij-ElHouati", email = "abdel.14@gmail.com" }]
requires-python = ">=3.10"
# Matplotlib and Pillow are required, although camfr imports them only when
# something is plotted (fast `import camfr`).
dependencies = ["numpy", "matplotlib", "pillow"]

[project.optional-dependencies]
scipy = ["scipy"]

[project.urls]
Homepage = "https://github.com/abdelix/camfr3"
Upstream = "https://github.com/demisjohn/CAMFR"

[dependency-groups]
# Installed by default with `uv sync`: SciPy, which GARCLED needs, pytest
# (with pytest-forked: one process per test), and the build tools for
# incremental rebuilds in .venv (`make dev`, see CLAUDE.md).
dev = ["scipy", "pytest>=8", "pytest-forked", "scikit-build-core>=0.11", "setuptools-scm>=8", "pybind11>=2.12,<3.1",
       "cmake>=3.26", "ninja"]

[tool.scikit-build]
minimum-version = "build-system.requires"
# Persistent build directory, so rebuilds are incremental.
build-dir = "build/{wheel_tag}"
metadata.version.provider = "scikit_build_core.metadata.setuptools_scm"
sdist.include = ["camfr/_version.py"]
# camfr/ holds both the Python package and the C++/Fortran sources; ship only
# the Python modules (the extension is installed by CMake). No subdirectory of
# camfr/ holds Python code.
wheel.packages = ["camfr"]
wheel.exclude = ["camfr/*/", "*.cpp", "*.h", "*.c", "*.f", "ChangeLog",
                 "camfr/_camfr.so"]

[[tool.scikit-build.generate]]
path = "camfr/_version.py"
template = '''__version__ = "${version}"
'''

[tool.setuptools_scm]
# Version from the latest git tag (vX.Y.Z); untagged commits get a .devN suffix.
# Used when no git metadata is available (e.g. a plain source archive):
fallback_version = "0+unknown"

[tool.pytest.ini_options]
# The testsuite modules are unittest files without a test_ prefix; see
# testsuite/conftest.py. --forked runs each test in its own process, so a
# segfault fails one test instead of the run, and CAMFR's global settings
# (PML, walls, solver switches) cannot leak from one test into the next.
testpaths = ["testsuite"]
python_files = ["*.py"]
# Not the default "test" prefix: 'from camfr import *' brings NumPy's test()
# helper into every module, which pytest would try to collect.
python_functions = ["test_*"]
addopts = ["--forked", "--import-mode=importlib"]

[tool.uv]
# uv only rebuilds the project when a cache key changes; the defaults cover
# pyproject.toml only, so list the sources and the build configuration too.
cache-keys = [
  { file = "pyproject.toml" },
  { file = "CMakeLists.txt" },
  { file = "local.cmake" },
  { file = "camfr/**/*.cpp" },
  { file = "camfr/**/*.h" },
  { file = "camfr/**/*.c" },
  { file = "camfr/**/*.f" },
  { file = "camfr/**/*.py" },
  { git = { commit = true, tags = true } },
]
